<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="halo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="200" r="180" fill="url(#halo-glow)"/>
  <circle cx="950" cy="180" r="220" fill="url(#halo-glow)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200"/>
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400"/>
  </g>

  <!-- Central Liquid Glass Card -->
  <rect x="80" y="50" width="1040" height="300" rx="28" fill="url(#glass-grad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Prismatic Top Highlight Strip -->
  <rect x="140" y="50" width="920" height="2" rx="1" fill="url(#prism-grad)"/>

  <!-- Left: Glowing Logo Symbol -->
  <g transform="translate(140, 110)">
    <!-- Outer glass badge -->
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="75" fill="none" stroke="url(#prism-grad)" stroke-width="2" opacity="0.6"/>
    <!-- Hourglass Path Graphic -->
    <path d="M50,45 H130 L95,90 L130,135 H50 L85,90 Z" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M50,45 H130 L95,90 L130,135 H50 L85,90 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Flowing Sand -->
    <path d="M68,125 Q90,95 112,125 Z" fill="#a855f7" opacity="0.85"/>
    <circle cx="90" cy="95" r="3" fill="#38bdf8"/>
    <circle cx="90" cy="107" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Right: Branding & Typography -->
  <text x="360" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="url(#text-grad)" letter-spacing="-1">ZenClock</text>
  <text x="615" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="2">PRO v1.0</text>
  
  <text x="360" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    Modern Zero-Scroll Focus Suite • Liquid Glass • Live Chronograph • IP Weather
  </text>

  <!-- Feature Pills -->
  <g transform="translate(360, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="65" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Zero Scroll</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="145" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="214" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">💧 Fluid Glass</text>

    <!-- Pill 3 -->
    <rect x="299" y="0" width="145" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="371" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">🌦️ IP Weather</text>

    <!-- Pill 4 -->
    <rect x="456" y="0" width="145" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="528" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">🇧🇩 🌙 Dual Date</text>

    <!-- Pill 5 -->
    <rect x="613" y="0" width="105" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="665" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="middle">12 Alarms</text>
  </g>

  <!-- Author Signature Pill -->
  <g transform="translate(360, 275)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Engineered with precision by <tspan fill="#38bdf8" font-weight="700">Mahir Ahmed</tspan> • MIT License
    </text>
  </g>
</svg>
